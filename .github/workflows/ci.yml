name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Lint et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
    
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: verifier

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: waxtan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max